<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Project Library</title>

   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">

   <link rel="stylesheet" href="style.css">
   <script src="script.js" defer></script>
</head>

<body>

   
   <div class="header">
      <h1>Lukas Caleb's Book Library</h1>
   </div>

   <div class="dialog-container">
      <dialog id="dialog">
         <form id="input-form" method="dialog">
            <div class="input">
               <input type="text" name="title" id="title" placeholder="Title" required />
            </div>
            <div class="input">
               <input type="text" name="author" id="author" placeholder="Author" required />
            </div>
            <div class="input">
               <input type="number" name="pages" id="pages" placeholder="Number of pages" required />
            </div>
            <div class="select">
               <select name="status" id="status">
                  <option value="Read">Read</option>
                  <option value="Not Read">Not Read</option>
               </select>
            </div>
               <input type="submit" id="cancel-button" value="Cancel" formnovalidate />
               <input type="submit" id="submit-button" value="Confirm" />
         </form>
      </dialog>
   </div>
   <div class="main-container">
      
      <button id="add-book-button">+ Add Book</button>
      
      <div class="books-container">

      </div>

   </div>
</body>

</html>
